<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aqua Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0066cc 0%, #00cc99 50%, #009999 100%);
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%);
            animation: moveGradient 15s ease infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes moveGradient {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, -50px); }
        }

        header {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            color: white;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .login-container {
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(25px);
            border-radius: 25px;
            padding: 3.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15), 0 0 1px rgba(255, 255, 255, 0.5) inset;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .login-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.2), 0 0 1px rgba(255, 255, 255, 0.5) inset;
        }

        .login-card h2 {
            background: linear-gradient(135deg, #0066cc 0%, #00cc99 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 0.7rem;
            color: #333;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .form-group input {
            padding: 1.1rem 1.1rem 1.1rem 50px;
            border: 2px solid #e0e7ff;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0066cc;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
        }

        .form-group input:valid {
            border-color: #00cc99;
        }

        .form-icons {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: #0066cc;
            opacity: 0.6;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 5;
        }

        .form-group input:focus ~ .form-icons {
            opacity: 1;
        }

        .password-toggle {
            position: absolute !important;
            right: 15px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            background: none !important;
            border: none !important;
            cursor: pointer !important;
            color: #0066cc !important;
            font-size: 1.1rem !important;
            padding: 0 !important;
            z-index: 10 !important;
            transition: all 0.2s !important;
            opacity: 0.7;
        }

        .password-toggle:hover {
            opacity: 1;
            transform: translateY(-50%) scale(1.1) !important;
        }

        #error-message {
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.1), rgba(192, 57, 43, 0.05)) !important;
            border-left: 4px solid #e74c3c !important;
            color: #c0392b !important;
            padding: 1rem !important;
            border-radius: 10px !important;
            font-size: 0.95rem !important;
            text-align: center !important;
            margin-bottom: 1rem !important;
            animation: slideInDown 0.4s ease-out !important;
            font-weight: 500 !important;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-btn, .demo-btn {
            padding: 1.1rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Poppins', sans-serif;
        }

        .login-btn {
            background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(0, 102, 204, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 102, 204, 0.4);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .demo-btn {
            background: linear-gradient(135deg, #00cc99 0%, #009999 100%);
            color: white;
            margin-top: 0.5rem;
            box-shadow: 0 10px 25px rgba(0, 204, 153, 0.3);
        }

        .demo-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 204, 153, 0.4);
        }

        .demo-btn:active {
            transform: translateY(-1px);
        }

        .loading {
            position: relative;
            color: transparent;
        }

        .loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .links {
            text-align: center;
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            font-size: 0.9rem;
        }

        .links a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
            position: relative;
            transition: color 0.3s ease;
        }

        .links a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #0066cc, #00cc99);
            transition: width 0.3s ease;
        }

        .links a:hover {
            color: #00cc99;
        }

        .links a:hover::after {
            width: 100%;
        }

        .divider {
            color: #ccc;
            font-weight: 300;
        }

        .demo-info {
            background: linear-gradient(135deg, rgba(0, 102, 204, 0.05), rgba(0, 204, 153, 0.05));
            border: 1px solid rgba(0, 102, 204, 0.1);
            border-radius: 12px;
            padding: 1.25rem;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #555;
        }

        .demo-info strong {
            color: #0066cc;
            font-weight: 700;
        }

        .demo-info small {
            display: block;
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }

        .demo-info small:last-child {
            margin-bottom: 0;
            opacity: 0.75;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .login-card {
                padding: 2.5rem;
                margin: 1rem;
            }

            .login-card h2 {
                font-size: 1.8rem;
            }

            main {
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.5rem;
            }

            header p {
                font-size: 0.9rem;
            }

            .login-card {
                padding: 2rem;
            }

            .login-card h2 {
                font-size: 1.5rem;
            }

            .login-btn, .demo-btn {
                font-size: 0.95rem;
                padding: 1rem 1.5rem;
            }

            .links {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>💧 Aqua Tracker</h1>
        <p>Industrial Water Conservation Platform</p>
    </header>
    <main>
        <div class="login-container">
            <div class="login-card">
                <h2>Welcome Back</h2>
                <p class="login-subtitle">Sign in to manage your industrial water usage</p>
                <form class="login-form" id="login-form">
                    <div class="form-group">
                        <label for="username">Email or Username</label>
                        <input type="text" id="username" name="username" required placeholder="Enter your email or username" autocomplete="username">
                        <i class="fas fa-envelope form-icons"></i>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
                        <i class="fas fa-lock form-icons"></i>
                    </div>
                    <div id="error-message" style="display: none;"></div>
                    <button type="submit" class="login-btn">
                        <i class="fas fa-arrow-right"></i> Sign In
                    </button>
                    <button type="button" class="demo-btn" id="demo-btn">
                        <i class="fas fa-play-circle"></i> Try Demo
                    </button>
                </form>
                <div class="links">
                    <a href="#" id="forgot-password">Forgot Password?</a>
                    <span class="divider">|</span>
                    <a href="#" id="sign-up">Create Account</a>
                </div>
                <div class="demo-info">
                    <small><strong>📧 Demo Credentials:</strong></small>
                    <small><strong>Email:</strong> user@example.com | <strong>Password:</strong> password123</small>
                    <small>Or: admin@example.com / admin123</small>
                </div>
            </div>
        </div>
    </main>
    <script>
        // Enhanced client-side login system
        // In a real application, this would be handled by a backend server
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const forgotPassword = document.getElementById('forgot-password');
        const signUp = document.getElementById('sign-up');
        const demoBtn = document.getElementById('demo-btn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        // Initialize default users (stored in localStorage)
        function initializeDefaultUsers() {
            const registeredUsers = localStorage.getItem('registeredUsers');
            if (!registeredUsers) {
                const defaultUsers = [
                    { email: 'user@example.com', username: 'user', password: 'password123', facility: 'Tech Factory' },
                    { email: 'admin@example.com', username: 'admin', password: 'admin123', facility: 'Main Facility' },
                    { email: 'john.doe@email.com', username: 'johndoe', password: 'johndoe456', facility: 'Production Plant' }
                ];
                localStorage.setItem('registeredUsers', JSON.stringify(defaultUsers));
            }
        }

        // Load registered users from localStorage
        function loadUsers() {
            initializeDefaultUsers();
            const registeredUsers = localStorage.getItem('registeredUsers');
            return JSON.parse(registeredUsers) || [];
        }

        // Validate email format
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Show error with animation
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            errorMessage.classList.remove('error-message');
            void errorMessage.offsetWidth; // Trigger reflow
            errorMessage.classList.add('error-message');
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 4000);
        }

        // Handle form submission
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            
            // Validation
            if (!username) {
                showError('Please enter your email or username');
                usernameInput.focus();
                return;
            }
            
            if (!password) {
                showError('Please enter your password');
                passwordInput.focus();
                return;
            }
            
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }
            
            // Show loading state
            const loginBtn = document.querySelector('.login-btn');
            const originalText = loginBtn.textContent;
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing In...';
            
            // Simulate server delay for better UX
            setTimeout(() => {
                const validUsers = loadUsers();
                
                // Check if user exists (check both username and email fields)
                const user = validUsers.find(u => {
                    const input = username.toLowerCase();
                    const userUsername = u.username ? u.username.toLowerCase() : '';
                    const userEmail = u.email ? u.email.toLowerCase() : '';
                    return (userUsername === input || userEmail === input) && u.password === password;
                });
                
                if (user) {
                    // Successful login - store in localStorage for session
                    localStorage.setItem('loggedInUser', user.username);
                    localStorage.setItem('userEmail', user.email);
                    localStorage.setItem('userFacility', user.facility || '');
                    
                    // Success feedback
                    loginBtn.innerHTML = '<i class="fas fa-check-circle"></i> Welcome!';
                    loginBtn.style.background = 'linear-gradient(135deg, #00cc99, #009999)';
                    loginBtn.disabled = true;
                    
                    // Redirect after brief delay
                    setTimeout(() => {
                        window.location.href = 'tracker.html';
                    }, 800);
                } else {
                    // Failed login
                    showError('Invalid credentials. Please check your email/username and password.');
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                    loginBtn.textContent = originalText;
                    usernameInput.focus();
                }
            }, 800);
        });

        // Real-time password visibility toggle
        const passwordToggle = document.createElement('button');
        passwordToggle.type = 'button';
        passwordToggle.className = 'password-toggle';
        passwordToggle.innerHTML = '<i class="fas fa-eye"></i>';
        passwordToggle.setAttribute('aria-label', 'Toggle password visibility');
        
        const passwordGroup = document.querySelector('.form-group:nth-child(2)');
        passwordGroup.appendChild(passwordToggle);
        
        passwordToggle.addEventListener('click', (e) => {
            e.preventDefault();
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordToggle.innerHTML = '<i class="fas fa-eye-slash"></i>';
                passwordToggle.setAttribute('aria-label', 'Hide password');
            } else {
                passwordInput.type = 'password';
                passwordToggle.innerHTML = '<i class="fas fa-eye"></i>';
                passwordToggle.setAttribute('aria-label', 'Show password');
            }
        });

        // Forgot password functionality
        forgotPassword.addEventListener('click', function(e) {
            e.preventDefault();
            alert('Password reset functionality would send an email to recover your account. For demo: use user@example.com / password123');
        });

        // Sign up link
        signUp.addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'signup.html';
        });

        // Demo button functionality
        demoBtn.addEventListener('click', function() {
            usernameInput.value = 'user@example.com';
            passwordInput.value = 'password123';
            loginForm.dispatchEvent(new Event('submit'));
        });

        // Allow Enter key to submit
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', function() {
            initializeDefaultUsers();
            usernameInput.focus();
        });
    </script>
</body>
</html>
